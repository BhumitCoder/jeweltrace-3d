    <!-- ── JSON-LD: FAQPage ─────────────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a JewelsReport diamond certificate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A JewelsReport certificate is an independent, third-party grading report issued after scientific analysis of a diamond or gemstone. It documents the 4Cs (Cut, Colour, Clarity, Carat), fluorescence, measurements, and origin. Every report is printed on a tamper-proof PVC card with holographic foil and a unique QR code for instant online verification."
          }
        },
        {
          "@type": "Question",
          "name": "How do I verify a JewelsReport certificate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Scan the QR code on the card with any smartphone camera, or visit jewelsreport.com/verify and enter the report number. Full grading details appear instantly — no login or registration required."
          }
        },
        {
          "@type": "Question",
          "name": "How long does diamond grading take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Standard turnaround is 3 working days from submission. Express 24-hour service is available on request for urgent orders. Bulk orders from wholesalers are handled on dedicated schedules."
          }
        },
        {
          "@type": "Question",
          "name": "Does JewelsReport certify lab grown diamonds?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. JewelsReport issues separate grading reports for CVD and HPHT lab-grown diamonds with full origin disclosure. The report clearly states 'Lab Grown Diamond' and includes the same 4Cs analysis as natural diamond reports."
          }
        },
        {
          "@type": "Question",
          "name": "Can a JewelsReport certificate be faked or forged?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is extremely difficult. Each card carries holographic foil, guilloché micro-print security features, and a unique report number that is cross-checked against our live server. Any duplicate or altered number will fail verification immediately."
          }
        },
        {
          "@type": "Question",
          "name": "Does JewelsReport certify coloured gemstones — rubies, emeralds, sapphires?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. JewelsReport issues gemstone reports for all coloured stones including ruby, emerald, sapphire, tanzanite, spinel and more. Reports include colour grade, clarity, origin determination where possible, and any treatment disclosure such as heat treatment or fracture filling."
          }
        },
        {
          "@type": "Question",
          "name": "What format is the JewelsReport certificate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every report is issued on a secure, credit-card-sized PVC certificate featuring holographic foil, a guilloché micro-pattern, a unique report number, and a QR code that links directly to the live laboratory record."
          }
        }
      ]
    }
    </script>

    <!-- ── JSON-LD: DefinedTermSet (Gemology Glossary) ──────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DefinedTermSet",
      "name": "JewelsReport Gemological Glossary",
      "description": "Key terms used in gemological certification by JewelsReport laboratory.",
      "definedTerm": [
        { "@type": "DefinedTerm", "name": "4Cs", "description": "Cut, Colour, Clarity and Carat Weight — the four internationally recognised standards for grading diamonds." },
        { "@type": "DefinedTerm", "name": "CVD Diamond", "description": "Chemical Vapour Deposition — a method of growing lab-grown diamonds in a vacuum chamber from a carbon-rich gas." },
        { "@type": "DefinedTerm", "name": "HPHT Diamond", "description": "High Pressure High Temperature — a method of growing lab-grown diamonds that mimics the natural conditions of the earth's mantle." },
        { "@type": "DefinedTerm", "name": "QR Verification", "description": "Instant certificate verification by scanning the QR code on the PVC card, linking to the live laboratory record." },
        { "@type": "DefinedTerm", "name": "PVC Certificate", "description": "A credit-card-sized (CR80) tamper-proof certificate with holographic foil and guilloché micro-pattern issued by JewelsReport." }
      ]
    }
    </script>
