<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F5EF"/>
      <stop offset="100%" style="stop-color:#EDE8DC"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C"/>
      <stop offset="50%" style="stop-color:#E8C56A"/>
      <stop offset="100%" style="stop-color:#B8922A"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C56A"/>
      <stop offset="100%" style="stop-color:#B8922A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#B8922A" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Gold top bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>
  <!-- Gold bottom bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#gold)"/>
  <!-- Gold left bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#goldV)"/>
  <!-- Gold right bar -->
  <rect x="1194" y="0" width="6" height="630" fill="url(#goldV)"/>

  <!-- Large diamond watermark -->
  <g opacity="0.05" transform="translate(900,315)">
    <polygon points="0,-180 155,-60 155,60 0,180 -155,60 -155,-60" fill="#B8922A"/>
    <polygon points="0,-180 155,-60 0,0 -155,-60" fill="#E8C56A"/>
    <polygon points="0,0 155,-60 155,60 0,180" fill="#9A7A22"/>
    <polygon points="0,0 0,180 -155,60 -155,-60" fill="#C9A84C"/>
  </g>

  <!-- Left accent circles -->
  <circle cx="80" cy="80" r="3" fill="#B8922A" opacity="0.4"/>
  <circle cx="110" cy="80" r="3" fill="#B8922A" opacity="0.4"/>
  <circle cx="80" cy="110" r="3" fill="#B8922A" opacity="0.4"/>
  <circle cx="110" cy="110" r="3" fill="#B8922A" opacity="0.4"/>

  <!-- Right top accent -->
  <circle cx="1120" cy="80" r="3" fill="#B8922A" opacity="0.4"/>
  <circle cx="1150" cy="80" r="3" fill="#B8922A" opacity="0.4"/>
  <circle cx="1120" cy="110" r="3" fill="#B8922A" opacity="0.4"/>
  <circle cx="1150" cy="110" r="3" fill="#B8922A" opacity="0.4"/>

  <!-- Diamond icon (centered top) -->
  <g transform="translate(600,140)">
    <polygon points="0,-45 39,-15 39,15 0,45 -39,15 -39,-15" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <polygon points="0,-45 39,-15 0,0 -39,-15" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <line x1="-39" y1="15" x2="39" y2="15" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="-39" y2="15" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="39" y2="15" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Horizontal rule under diamond -->
  <rect x="500" y="200" width="200" height="1.5" fill="url(#gold)" opacity="0.7"/>

  <!-- Brand name -->
  <text x="600" y="295" font-family="Georgia,'Times New Roman',serif" font-size="82" font-weight="400" text-anchor="middle" fill="#111111" letter-spacing="-1">Jewels<tspan fill="#B8922A">Report</tspan></text>

  <!-- Tagline -->
  <text x="600" y="345" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#666666" letter-spacing="8">CERTIFICATION LAB</text>

  <!-- Divider -->
  <rect x="440" y="375" width="320" height="1" fill="url(#gold)" opacity="0.5"/>

  <!-- Description -->
  <text x="600" y="420" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="400" text-anchor="middle" fill="#444444">Diamond · Gemstone · Jewellery Reports</text>
  <text x="600" y="455" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#888888" letter-spacing="1">Tamper-proof PVC certificates with QR verification · 150,000+ reports issued</text>

  <!-- Trust badges row -->
  <g transform="translate(300,510)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="170" height="44" rx="22" fill="none" stroke="#B8922A" stroke-width="1.2" opacity="0.7"/>
    <text x="85" y="28" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#B8922A">✓  Holographic Foil</text>

    <!-- Badge 2 -->
    <rect x="185" y="0" width="150" height="44" rx="22" fill="none" stroke="#B8922A" stroke-width="1.2" opacity="0.7"/>
    <text x="260" y="28" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#B8922A">✓  QR Verified</text>

    <!-- Badge 3 -->
    <rect x="350" y="0" width="150" height="44" rx="22" fill="none" stroke="#B8922A" stroke-width="1.2" opacity="0.7"/>
    <text x="425" y="28" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#B8922A">✓  ISO Aligned</text>
  </g>

  <!-- URL bottom -->
  <text x="600" y="600" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#AAAAAA" letter-spacing="2">www.jewelsreport.com</text>
</svg>
